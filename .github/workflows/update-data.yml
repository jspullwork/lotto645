name: 당첨번호 데이터 갱신

on:
  schedule:
    # 토요일 20:35 KST 추첨 → 일요일 00:00 KST(토 15:00 UTC), 누락 대비 일요일 12:00 KST(일 03:00 UTC)
    - cron: '0 15 * * 6'
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 데이터 갱신
        run: node update-data.mjs

      - name: 변경 사항 커밋
        run: |
          # 첫 줄의 생성 시각만 바뀐 경우는 커밋하지 않음
          if git diff -U0 -- data/lotto-data.js | grep -E '^[+-]\[' > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/lotto-data.js
            git commit -m "data: $(grep -o '^\[[0-9]*' data/lotto-data.js | tail -1 | tr -d '[')회차까지 갱신"
            git push
          else
            echo "새 회차 없음"
          fi
